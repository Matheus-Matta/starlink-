# Produção em VPS: a aplicação é puxada do GitHub Container Registry; nada é compilado no servidor.
# Antes de iniciar: copie .env.example para .env, preencha domínio/segredos e proteja com chmod 600.
name: starlink

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/matheus-matta/starlinks:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: https://${DOMAIN:?Defina DOMAIN no .env}
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64:?Gere ADMIN_PASSWORD_HASH_B64 com admin:bootstrap}
      SESSION_SECRET: ${SESSION_SECRET:?Gere SESSION_SECRET com admin:bootstrap}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Gere DATA_ENCRYPTION_KEY com admin:bootstrap}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      STATS_FLUSH_SECONDS: ${STATS_FLUSH_SECONDS:-60}
      # Somente o Caddy alcança a porta da aplicação e define os headers de proxy.
      TRUST_PROXY: "true"
    volumes:
      - type: volume
        source: starlink-storage
        target: /app/storage
      - type: volume
        source: starlink-backups
        target: /app/backups
    expose:
      - "3000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Uma única réplica: sessões, índice e contadores ficam na memória do processo.
    deploy:
      replicas: 1

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-1.0}
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true

volumes:
  starlink-storage:
  starlink-backups:
  caddy-data:
  caddy-config:
